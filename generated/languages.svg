<span class="progress">
<span style="background-color:#4F5D95;width:28.438%" class="progress-item"></span><span style="background-color:#DA5B0B;width:20.888%" class="progress-item"></span><span style="background-color:#b07219;width:16.278%" class="progress-item"></span><span style="background-color:#663399;width:9.505%" class="progress-item"></span><span style="background-color:#f1e05a;width:9.288%" class="progress-item"></span><span style="background-color:#945db7;width:6.927%" class="progress-item"></span><span style="background-color:#e34c26;width:3.978%" class="progress-item"></span><span style="background-color:#f34b7d;width:3.251%" class="progress-item"></span><span style="background-color:#C1F12E;width:0.528%" class="progress-item"></span><span style="background-color:#878787;width:0.494%" class="progress-item"></span><span style="background-color:#e38c00;width:0.425%" class="progress-item"></span>
</span>
</div>

